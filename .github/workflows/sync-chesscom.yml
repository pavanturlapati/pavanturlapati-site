name: Sync Chess.com

# Pulls ratings and recent games into data/chesscom.json a few times a day.
# If anything changed, it commits the file and triggers a fresh deploy.
on:
  schedule:
    - cron: "43 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Chess.com data
        run: node scripts/sync-chesscom.mjs

      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/chesscom.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/chesscom.json
            git commit -m "Sync Chess.com"
            git push
            gh workflow run deploy.yml
          else
            echo "No new Chess.com activity."
          fi
