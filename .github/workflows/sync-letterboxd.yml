name: Sync Letterboxd

# Pulls new Letterboxd activity into data/letterboxd.json once a day. If
# anything changed, it commits the file and triggers a fresh deploy.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Letterboxd feed
        run: node scripts/sync-letterboxd.mjs

      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/letterboxd.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/letterboxd.json
            git commit -m "Sync Letterboxd"
            git push
            # Pushes made with the default token don't trigger other
            # workflows, so start the deploy explicitly.
            gh workflow run deploy.yml
          else
            echo "No new Letterboxd activity."
          fi
